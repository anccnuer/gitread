name: Build WASIX wasm and deploy to Wasmer Edge

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wasix
        run: cargo install cargo-wasix --locked

      - name: Install native linker (for host build scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils lld

      - name: Build wasm (wasm32-wasmer-wasi)
        run: |
          rm -f Cargo.lock  # 针对 WASIX registry 重新解析依赖
          cargo wasix build --release

      - name: Verify wasm exists
        run: ls -l target/wasm32-wasmer-wasi/release/gitread-edge.wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitread-edge-wasm
          path: target/wasm32-wasmer-wasi/release/gitread-edge.wasm
          if-no-files-found: error

      - name: Install wasmer CLI
        run: curl -fsSL https://get.wasmer.io | sh

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: ~/.wasmer/bin/wasmer deploy --token "$WASMER_TOKEN" --owner anccnuer
