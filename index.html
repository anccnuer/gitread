<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitRead · GitHub README & Release 加速器</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
          integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
          integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --border:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica","Arial",sans-serif;
           background:var(--bg); color:var(--fg); line-height:1.6; }
    header { padding:24px 20px; text-align:center; border-bottom:1px solid var(--border); }
    header h1 { margin:0; font-size:22px; }
    header p { margin:6px 0 0; color:var(--muted); font-size:14px; }
    main { max-width:960px; margin:0 auto; padding:20px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; background:var(--card); padding:14px;
           border:1px solid var(--border); border-radius:12px; }
    .bar input { flex:1; min-width:240px; padding:10px 12px; border-radius:8px;
                 border:1px solid var(--border); background:#0b1220; color:var(--fg); font-size:15px; }
    button { padding:10px 16px; border:none; border-radius:8px; background:var(--accent);
             color:#04222e; font-weight:600; cursor:pointer; font-size:15px; }
    button:disabled { opacity:.6; cursor:default; }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    .status { margin:12px 4px; color:var(--muted); font-size:14px; min-height:20px; }
    .status.error { color:#f87171; }
    section { margin-top:22px; }
    #readme { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px; overflow-wrap:anywhere; }
    #readme img { max-width:100%; }
    #readme pre { background:#0b1220; padding:12px; border-radius:8px; overflow:auto; }
    #readme code { background:#0b1220; padding:1px 5px; border-radius:5px; }
    #readme a { color:var(--accent); }
    #readme table { border-collapse:collapse; } #readme th,#readme td { border:1px solid var(--border); padding:6px 10px; }
    .release { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
    .release h3 { margin:0 0 4px; font-size:17px; }
    .release .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
    .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid var(--border); margin-left:8px; }
    .tag.pre { color:#fbbf24; border-color:#fbbf24; }
    .asset { display:flex; justify-content:space-between; align-items:center; gap:12px;
             padding:8px 0; border-top:1px dashed var(--border); }
    .asset .name { overflow-wrap:anywhere; }
    .asset .size { color:var(--muted); font-size:13px; margin-left:8px; }
    .empty { color:var(--muted); text-align:center; padding:30px; }
    footer { text-align:center; color:var(--muted); font-size:13px; padding:24px; }
    a.dl { text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <h1>GitRead · README 预览 & Release 加速下载</h1>
    <p>粘贴 GitHub 仓库链接，一键获取 README；查看 Release 并通过 Wasmer Edge 加速下载产物。</p>
  </header>
  <main>
    <div class="bar">
      <input id="url" placeholder="https://github.com/owner/repo" autofocus />
      <button id="btnReadme">获取 README</button>
      <button id="btnRelease" class="ghost">获取 Release</button>
    </div>
    <div id="status" class="status"></div>

    <section id="releaseSection" style="display:none;">
      <h2 style="font-size:18px;">Releases</h2>
      <div id="releases"></div>
    </section>

    <section id="readmeSection" style="display:none;">
      <h2 style="font-size:18px;">README</h2>
      <article id="readme"></article>
    </section>
  </main>
  <footer>运行于 Wasmer Edge · WASIX + Axum + reqwest</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const fmtSize = (n) => {
      if (!n) return "";
      const u = ["B","KB","MB","GB"]; let i = 0, v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return v.toFixed(v >= 100 ? 0 : 1) + " " + u[i];
    };
    const setStatus = (msg, isErr) => {
      statusEl.textContent = msg || "";
      statusEl.classList.toggle("error", !!isErr);
    };
    const getVal = () => $("url").value.trim();

    async function loadReadme() {
      const url = getVal();
      if (!url) return setStatus("请输入 GitHub 链接", true);
      $("btnReadme").disabled = true;
      setStatus("正在获取 README…");
      try {
        const r = await fetch("/api/readme?url=" + encodeURIComponent(url));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
        $("readmeSection").style.display = "block";
        const html = DOMPurify.sanitize(marked.parse(d.content || ""));
        $("readme").innerHTML = html || '<div class="empty">README 为空</div>';
        setStatus(`已加载 ${d.owner}/${d.repo} 的 README`);
      } catch (e) {
        setStatus("失败：" + e.message, true);
      } finally {
        $("btnReadme").disabled = false;
      }
    }

    async function loadReleases() {
      const url = getVal();
      if (!url) return setStatus("请输入 GitHub 链接", true);
      $("btnRelease").disabled = true;
      setStatus("正在获取 Release…");
      try {
        const r = await fetch("/api/releases?url=" + encodeURIComponent(url));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
        $("releaseSection").style.display = "block";
        const box = $("releases");
        box.innerHTML = "";
        const list = d.releases || [];
        if (!list.length) {
          box.innerHTML = '<div class="empty">该仓库暂无 Release</div>';
          setStatus(`已查询 ${d.owner}/${d.repo}`);
          return;
        }
        for (const rel of list) {
          const card = document.createElement("div");
          card.className = "release";
          const title = rel.name || rel.tag_name || "未命名";
          const date = (rel.published_at || "").slice(0, 10);
          const pre = rel.prerelease ? '<span class="tag pre">预发布</span>' : "";
          let assetsHtml = "";
          for (const a of (rel.assets || [])) {
            const href = "/api/download?url=" + encodeURIComponent(a.browser_download_url) +
                         "&name=" + encodeURIComponent(a.name);
            assetsHtml += `<div class="asset">
                <span class="name">${escapeHtml(a.name)}<span class="size">${fmtSize(a.size)}</span></span>
                <a class="dl" href="${href}"><button class="ghost">⚡ 加速下载</button></a>
              </div>`;
          }
          if (!(rel.assets || []).length) assetsHtml = '<div class="empty" style="padding:10px;">无二进制产物</div>';
          card.innerHTML = `<h3>${escapeHtml(title)} <span class="tag">${escapeHtml(rel.tag_name||"")}</span>${pre}</h3>
            <div class="meta">${escapeHtml(date)}</div>${assetsHtml}`;
          box.appendChild(card);
        }
        setStatus(`已获取 ${d.owner}/${d.repo} 的 ${list.length} 个 Release`);
      } catch (e) {
        setStatus("失败：" + e.message, true);
      } finally {
        $("btnRelease").disabled = false;
      }
    }

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, (c) =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    $("btnReadme").addEventListener("click", loadReadme);
    $("btnRelease").addEventListener("click", loadReleases);
    $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") loadReadme(); });
  </script>
</body>
</html>
